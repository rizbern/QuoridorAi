<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QUORIDOR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="noise"></div>

  <!-- Header -->
  <header class="header">
    <div class="header-title">
      <span class="title-q">Q</span><span class="title-rest">UORIDOR</span>
    </div>
    <div class="header-sub">MCTS AI · HUMAN VS MACHINE</div>
  </header>

  <!-- Layout -->
  <div class="layout">

    <!-- Left panel: Human player -->
    <div class="panel panel-left">
      <div class="player-card" id="card-x">
        <div class="player-badge badge-x">X</div>
        <div class="player-name">YOU</div>
        <div class="player-role">HUMAN</div>
        <div class="wall-section">
          <div class="wall-label">WALLS</div>
          <div class="wall-pips" id="pips-x"></div>
          <div class="wall-number" id="walls-x">10</div>
        </div>
      </div>

      <div class="mode-panel">
        <div class="mode-label">MODE</div>
        <button class="mode-btn active" id="btn-pawn" onclick="setMode('pawn')">
          <span class="mode-icon">⬤</span> MOVE
        </button>
        <button class="mode-btn" id="btn-wall-h" onclick="setMode('wall-h')">
          <span class="mode-icon">━</span> H-WALL
        </button>
        <button class="mode-btn" id="btn-wall-v" onclick="setMode('wall-v')">
          <span class="mode-icon">┃</span> V-WALL
        </button>
      </div>
    </div>

    <!-- Board area -->
    <div class="board-wrap">
      <div class="board-container">
        <canvas id="board-canvas"></canvas>
        <canvas id="overlay-canvas"></canvas>
      </div>
      <div class="turn-bar" id="turn-bar">YOUR TURN — SELECT A MODE AND CLICK</div>
    </div>

    <!-- Right panel: AI player -->
    <div class="panel panel-right">
      <div class="player-card" id="card-o">
        <div class="player-badge badge-o">O</div>
        <div class="player-name">CPU</div>
        <div class="player-role">MCTS AI</div>
        <div class="wall-section">
          <div class="wall-label">WALLS</div>
          <div class="wall-pips" id="pips-o"></div>
          <div class="wall-number" id="walls-o">10</div>
        </div>
      </div>

      <div class="log-panel">
        <div class="log-label">GAME LOG</div>
        <div class="log-entries" id="log-entries"></div>
      </div>
    </div>

  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <button class="action-btn" id="btn-new-game" onclick="newGame()">NEW GAME</button>
    <div class="thinking-bar" id="thinking-bar">
      <div class="thinking-dot"></div>
      <div class="thinking-dot"></div>
      <div class="thinking-dot"></div>
      <span>AI THINKING</span>
    </div>
    <div class="hint-text" id="hint-text">Click your pawn or choose a mode to begin</div>
  </div>

  <!-- Win overlay -->
  <div class="win-overlay" id="win-overlay">
    <div class="win-box">
      <div class="win-title" id="win-title">YOU WIN</div>
      <div class="win-sub" id="win-sub">Congratulations — you outplayed the machine.</div>
      <button class="action-btn win-btn" onclick="newGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
